name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and Test
        run: |
          set -eo pipefail
          DEST=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | .value[]
             | select(.isAvailable == true and (.name | startswith("iPhone")))
            ] | first
            | if . == null then empty else "platform=iOS Simulator,id=\(.udid)" end
          ')
          if [[ -z "${DEST}" ]]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using destination: ${DEST}"
          xcodebuild test \
            -project "MVVM Demo.xcodeproj" \
            -scheme "MVVM Demo" \
            -sdk iphonesimulator \
            -destination "${DEST}" \
            -quiet
