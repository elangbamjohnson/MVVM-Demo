name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and Test
        run: |
          xcodebuild test \
            -project "MVVM Demo.xcodeproj" \
            -scheme "MVVM Demo" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -quiet
